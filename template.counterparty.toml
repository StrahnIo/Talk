# Message templates (Tera syntax) — ZODL-branded counterparty set.
#
# Point [mailbox] template_path in config.counterparty.toml at this file.
# Context variables available to every template:
#   sender_name, sender_address, amount, invoice, received_at
#
# The body is a complete, self-contained HTML document (inline CSS) rendered
# as a branded ZODL payment form.

[invoice]
subject = "ZODL payment from {{ sender_name }}"
body = """<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ZODL payment</title></head>
<body style="margin:0;padding:0;background:#0e1116;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e7ecf3;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e1116;padding:40px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#161b26;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.45);border:1px solid #232b3b;">
        <tr><td style="background:#111827;padding:22px 30px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td><span style="color:#22d3ee;font-size:22px;font-weight:800;letter-spacing:1px;">ZODL</span>
                <span style="color:#64748b;font-size:12px;font-weight:600;letter-spacing:2px;margin-left:8px;">PAYMENTS</span></td>
              <td align="right"><span style="color:#475569;font-size:11px;letter-spacing:1px;">SECURE · PRIVATE</span></td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:30px 34px;">
          <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Payment request from</div>
          <div style="font-size:21px;font-weight:700;color:#f1f5f9;margin-top:6px;">{{ sender_name | escape }}</div>
          <div style="font-size:13px;color:#94a3b8;margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;">{{ sender_address | escape }}</div>

          {% if amount %}
          <div style="margin-top:26px;background:linear-gradient(135deg,#0f3b46,#132b3d);border:1px solid #22d3ee33;border-radius:10px;padding:18px 22px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:13px;color:#7dd3fc;">Amount due</td>
                <td align="right" style="font-size:28px;font-weight:800;color:#22d3ee;">{{ amount | escape }} <span style="font-size:14px;color:#7dd3fc;">ZEC</span></td>
              </tr>
            </table>
          </div>
          {% endif %}

          <div style="margin-top:22px;font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:1px;">Invoice details</div>
          <pre style="margin:8px 0 0;padding:14px 18px;background:#0f141e;border:1px solid #232b3b;border-radius:10px;font-size:13px;line-height:1.55;color:#cbd5e1;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;">{{ invoice | escape }}</pre>

          <div style="margin-top:26px;">
            <a href="#" style="display:inline-block;background:#22d3ee;color:#0e1116;text-decoration:none;font-weight:800;font-size:15px;padding:14px 32px;border-radius:10px;">Authorize payment</a>
            <span style="display:inline-block;margin-left:12px;font-size:12px;color:#64748b;">Settle via shielded memo &middot; ZODL</span>
          </div>
        </td></tr>
        <tr><td style="padding:18px 34px;border-top:1px solid #232b3b;font-size:11px;color:#475569;">
          Received {{ received_at }} &middot; ZODL Payments &mdash; example.com
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
"""
